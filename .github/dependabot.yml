version: 2
updates:
  # Kirby comes from Packagist at build time, the base image from versions.json
  # via update-versions.yml. What is left are the actions, pinned to commit
  # SHAs, and the opencode release the agent tasks run.
  #
  # The cooldown keeps a release that turns out to be malicious, or is pulled
  # within days, from being proposed the moment it is published.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [automation]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /.github/opencode
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [automation]
