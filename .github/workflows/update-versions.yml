name: update versions

# Watches for the two upstream changes that a build cannot pick up on its own,
# and treats them differently because they are different in kind:
#
#   - A newer PHP minor supported by both Kirby and FrankenPHP is a version
#     string. It is applied and becomes a pull request that CI builds and smoke
#     tests end to end, so it can be reviewed and merged as it stands.
#
#   - A new Kirby major needs a reader: a plainkit release that may not exist
#     yet, a decision about the `latest` tag, a decision about the branch it
#     replaces, and a README table that nothing generates. So it is handed to
#     the add-kirby-branch skill running under opencode, which does the work,
#     builds and smoke tests it, and opens the pull request itself.
#
# New Kirby *patch* releases need no run of this workflow — the daily publish
# resolves those from Packagist by itself.

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: update-versions
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    name: propose versions.json updates
    runs-on: ubuntu-latest
    if: github.repository == 'mittwald/kirby-docker'
    outputs:
      handoffs: ${{ steps.check.outputs.handoffs }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Kirby and FrankenPHP for changes
        id: check
        run: python3 scripts/check-updates.py --apply --github-output

      - name: Report
        env:
          REPORT: ${{ steps.check.outputs.report }}
        run: printf '%s\n' "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      # Mechanical and verifiable: CI builds and smoke tests the proposal, so a
      # green run means the new PHP version actually boots and serves Kirby.
      - name: Open pull request for the applied changes
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/versions-update
          base: main
          title: "chore: update versions.json"
          commit-message: "chore: update versions.json"
          delete-branch: true
          labels: automation
          body: |
            ${{ steps.check.outputs.report }}

            ---

            Opened by `.github/workflows/update-versions.yml`, which only
            applies changes it can finish on its own. CI builds and smoke tests
            every branch in `versions.json`, so a green run here means the
            proposed combination actually boots and serves Kirby.

            To freeze a branch's PHP version against this automation, add
            `"phpPolicy": "pinned"` to it.

  # Not mechanical, so it is handed to the skill that knows how to do it. The
  # agent gets the facts this job already established as its briefing, adds the
  # branch, builds it, runs the smoke test and opens the pull request.
  add-branch:
    name: add the new Kirby major
    needs: propose
    if: needs.propose.outputs.handoffs == 'true'
    uses: ./.github/workflows/agent-task.yml
    with:
      task: add-kirby-branch
      branch-prefix: automation/add-kirby-branch
      briefing-command: python3 scripts/check-updates.py --briefing-to "$BRIEFING"
      prompt: |
        A new Kirby major has been released that this repository does not build
        yet. Run the `add-kirby-branch` skill to add it, and follow that skill's
        rules — in particular the one about plainkit lagging the CMS, and its
        verification steps.

        Build and smoke test every branch in `versions.json`, not only the one
        you added: the point of the change is that all of them still work.
    secrets:
      MITTWALD_AI_API_KEY: ${{ secrets.MITTWALD_AI_API_KEY }}
      RELEASE_USER_TOKEN: ${{ secrets.RELEASE_USER_TOKEN }}
