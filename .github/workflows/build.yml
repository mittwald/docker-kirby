name: build

# Reusable build pipeline. Everything that varies between images comes from
# versions.json via scripts/resolve-versions.py, so neither this workflow nor
# the Dockerfile has to change when a Kirby branch is added.
#
# Each architecture builds on a runner of its own architecture and pushes an
# untagged image identified by its digest; the merge job assembles the tag
# ladder from those digests.

on:
  workflow_call:
    inputs:
      push:
        description: Push the resulting images to Docker Hub.
        type: boolean
        default: false
      no-cache:
        description: Ignore the layer cache. Used by the scheduled rebuild so
          that distribution security updates are actually picked up.
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  resolve:
    name: resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      # One entry per branch, for the job that assembles the tag ladder.
      matrix: ${{ steps.resolve.outputs.matrix }}
      # One entry per branch and architecture, for the builds themselves.
      build-matrix: ${{ steps.resolve.outputs.build-matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions.json against Packagist
        id: resolve
        run: |
          {
            echo '### Build matrix'
            echo '```'
            python3 scripts/resolve-versions.py --github-output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: kirby ${{ matrix.branch }} (${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v4

      # No setup-qemu-action: every job builds its own architecture.
      - uses: docker/setup-buildx-action@v3

      - name: Build metadata
        id: meta
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # Loaded into the local daemon so the smoke test runs against the exact
      # image this job is about to push.
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: ./image
          file: ./image/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          no-cache: ${{ inputs.no-cache }}
          tags: kirby-ci:${{ matrix.branch }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            KIRBY_VERSION=${{ matrix.kirby_version }}
            PLAINKIT_CONSTRAINT=${{ matrix.plainkit }}
            PHP_VERSION=${{ matrix.php }}
            FRANKENPHP_VERSION=${{ matrix.frankenphp }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          # Per architecture, so the two jobs do not overwrite each other's
          # cache with a layer set the other one cannot use.
          cache-from: type=gha,scope=kirby-${{ matrix.branch }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=kirby-${{ matrix.branch }}-${{ matrix.arch }}

      - name: Smoke test
        env:
          BRANCH: ${{ matrix.branch }}
          KIRBY_VERSION: ${{ matrix.kirby_version }}
          PHP_VERSION: ${{ matrix.php }}
        run: |
          ./scripts/smoke-test.sh "kirby-ci:${BRANCH}" \
            --kirby-version "${KIRBY_VERSION}" \
            --php-version "${PHP_VERSION}"

      - name: Log in to Docker Hub
        if: inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Untagged on purpose: a tag pushed from here would name a
      # single-architecture image, and the second job to finish would overwrite
      # the first. The merge job below assembles the tags.
      - name: Build and push by digest
        id: push
        if: inputs.push
        uses: docker/build-push-action@v6
        with:
          context: ./image
          file: ./image/Dockerfile
          platforms: ${{ matrix.platform }}
          no-cache: ${{ inputs.no-cache }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            KIRBY_VERSION=${{ matrix.kirby_version }}
            PLAINKIT_CONSTRAINT=${{ matrix.plainkit }}
            PHP_VERSION=${{ matrix.php }}
            FRANKENPHP_VERSION=${{ matrix.frankenphp }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=kirby-${{ matrix.branch }}-${{ matrix.arch }}

      # An empty file named after the digest: the merge job only needs the name.
      - name: Export digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eux
          test -n "${DIGEST}"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.branch }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Summary
        env:
          BRANCH: ${{ matrix.branch }}
          KIRBY_VERSION: ${{ matrix.kirby_version }}
          PHP_VERSION: ${{ matrix.php }}
          BASE_IMAGE: ${{ matrix.base_image }}
          PLATFORM: ${{ matrix.platform }}
          RUNNER: ${{ matrix.runner }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### kirby ${BRANCH} (${PLATFORM})"
            echo
            echo "- Kirby \`${KIRBY_VERSION}\` on PHP \`${PHP_VERSION}\` (\`${BASE_IMAGE}\`)"
            echo "- Built and smoke tested on \`${RUNNER}\`"
            echo "- Digest: \`${DIGEST:-not pushed}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The only place a tag is written, so a tag never refers to a half-finished
  # set of architectures.
  merge:
    name: publish kirby ${{ matrix.branch }}
    needs: [resolve, build]
    if: inputs.push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.branch }}-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Matrix values go through the environment rather than into the script
      # body, so nothing in versions.json can end up being executed.
      - name: Create manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORMS: ${{ matrix.platforms }}
          TAGS: ${{ join(matrix.tags, ' ') }}
        run: |
          set -eu

          # An architecture whose build failed would otherwise publish a
          # manifest quietly missing it.
          expected="$(echo "${PLATFORMS}" | tr ',' '\n' | grep -c .)"
          actual="$(find . -type f | wc -l)"
          if [ "${actual}" -ne "${expected}" ]; then
            echo "expected ${expected} digests, found ${actual}" >&2
            exit 1
          fi

          set --
          for tag in ${TAGS}; do
            set -- "$@" --tag "${tag}"
          done
          for digest in *; do
            set -- "$@" "${IMAGE}@sha256:${digest}"
          done

          docker buildx imagetools create "$@"

      - name: Summary
        env:
          BRANCH: ${{ matrix.branch }}
          KIRBY_VERSION: ${{ matrix.kirby_version }}
          PHP_VERSION: ${{ matrix.php }}
          BASE_IMAGE: ${{ matrix.base_image }}
          PLATFORMS: ${{ matrix.platforms }}
          TAGS: ${{ join(matrix.tags, ' ') }}
          FIRST_TAG: ${{ matrix.tags[0] }}
        run: |
          {
            echo "### kirby ${BRANCH}"
            echo
            echo "- Kirby \`${KIRBY_VERSION}\` on PHP \`${PHP_VERSION}\` (\`${BASE_IMAGE}\`)"
            echo "- Platforms: \`${PLATFORMS}\`"
            echo "- Tags:"
            for tag in ${TAGS}; do echo "  - \`${tag}\`"; done
            echo
            echo '```'
            docker buildx imagetools inspect "${FIRST_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
