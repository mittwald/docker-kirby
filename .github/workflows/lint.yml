name: lint

# Deliberately thin: every check lives in scripts/lint.sh with a pinned,
# containerised tool, so what runs here is exactly what a contributor or an
# agent runs locally. Pinning is the point — this job once passed locally and
# failed here because the hadolint action carried 2.12 while local runs used
# :latest, and only 2.12 mis-reads `FROM ${BASE_IMAGE}` as untagged.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scripts/lint.sh
        run: ./scripts/lint.sh
