name: lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: image/Dockerfile
          failure-threshold: warning

      - name: Shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=warning scripts/*.sh image/entrypoint.sh

      - name: Workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Python
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: PHP syntax
        run: |
          docker run --rm -v "$PWD:/src" -w /src --entrypoint sh dunglas/frankenphp:1 -c \
            'find image -name "*.php" -print0 | xargs -0 -n1 php -l'

      - name: Caddyfile formatting
        run: |
          docker run --rm -v "$PWD/image:/src" -w /src --entrypoint frankenphp dunglas/frankenphp:1 \
            fmt Caddyfile > /dev/null

      - name: versions.json is valid and canonically formatted
        run: |
          python3 scripts/resolve-versions.py
          # Keeping the file in the formatting the automation emits means an
          # automated bump shows only the line it changed.
          python3 scripts/check-updates.py --reformat
          git diff --exit-code versions.json \
            || { echo "::error::versions.json is not canonically formatted; run: python3 scripts/check-updates.py --reformat"; exit 1; }
