name: ci

on:
  # Pull requests only. Adding `push:` back builds every commit twice once a
  # pull request is open: `concurrency` cannot collapse the two events, because
  # `github.ref` is `refs/heads/<branch>` for one and `refs/pull/<n>/merge` for
  # the other.
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request makes the running build irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  build:
    needs: lint
    uses: ./.github/workflows/build.yml
    with:
      push: false
