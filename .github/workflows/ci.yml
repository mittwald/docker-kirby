name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# A newer push to the same branch makes the running build irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  build:
    needs: lint
    uses: ./.github/workflows/build.yml
    with:
      push: false
