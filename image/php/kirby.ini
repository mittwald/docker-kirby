; Settings that are fixed for the image. Everything meant to be tuned per
; deployment lives in the `php_ini` block of /etc/caddy/Caddyfile and is driven
; by PHP_* environment variables.

expose_php = Off

; Kirby's panel uploads and content files are the reason for the generous
; limits; the effective values come from PHP_UPLOAD_MAX_FILESIZE et al.
memory_limit = 256M

; OPcache. The application is immutable inside the image, so the cache is sized
; for the whole codebase and kept warm for the container lifetime.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Kirby manages its own file-based sessions below the storage root; PHP's own
; session handler is only a fallback and should not write to /tmp unnoticed.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

log_errors = On
error_log = /dev/stderr
